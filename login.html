<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/logo.png" type="image/png">
<title>Log in — Active Life Medical</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="auth-wrap">
  <div class="auth-card">
    <span class="eyebrow">Welcome back</span>
    <h1>Log in to your account</h1>
    <p class="sub">Access your cart, orders, and saved details.</p>

    <div class="form-msg" id="form-msg"></div>

    <form id="login-form" novalidate>
      <div class="field" id="field-email">
        <label for="email">Email address</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
        <div class="field-error">Enter a valid email address.</div>
      </div>
      <div class="field" id="field-password">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false"></button>
        </div>
        <div class="field-error">Enter your password.</div>
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-switch">Don't have an account? <a href="register.html">Create one</a></p>
  </div>
</div>

<div id="site-footer"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/forms.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/login.js"></script>
</body>
</html>
