<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/logo.png" type="image/png">
<title>All products — Active Life Medical</title>
<meta name="description" content="Browse every medical device in the Active Life Medical catalog — filter by category or shop the full list.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="site-header"></div>

<div class="container breadcrumb">
  <a href="index.html">Home</a><span class="sep">/</span><span>Products</span>
</div>

<div class="container page-title-block">
  <span class="eyebrow">Shop</span>
  <h1>All products</h1>
  <p style="color:var(--color-text-muted); max-width:60ch;">Every device in the catalog — filter by category or browse the full list.</p>
</div>

<main class="section" style="padding-top:24px;">
  <div class="container">
    <div class="toolbar">
      <input type="search" id="product-search" class="product-search" placeholder="Search by name, description, or category…" autocomplete="off" aria-label="Search products">
      <select id="product-sort" class="product-sort" aria-label="Sort products">
        <option value="default">Default order</option>
        <option value="price-asc">Price: low to high</option>
        <option value="price-desc">Price: high to low</option>
        <option value="name-asc">Name: A to Z</option>
        <option value="name-desc">Name: Z to A</option>
        <option value="stock-desc">Stock: most first</option>
        <option value="stock-asc">Stock: least first</option>
      </select>
      <button type="button" id="clear-filters" class="clear-filters" hidden aria-label="Clear all filters">× Clear filters</button>
    </div>
    <div class="filter-row" id="filter-row"></div>
    <div class="product-grid" id="product-grid"></div>
  </div>
</main>

<div id="site-footer" data-footer="full"></div>

<script src="js/products.js"></script>
<script src="js/auth.js"></script>
<script src="js/cart.js"></script>
<script src="js/main.js"></script>
<script src="js/layout.js"></script>
<script src="js/pages/products.js"></script>
</body>
</html>
